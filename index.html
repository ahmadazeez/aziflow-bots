<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B1B1C">
<link rel="icon" type="image/png" href="shared/brand/favicon.png">
<link rel="apple-touch-icon" href="shared/brand/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AZIflow">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>AZIflow Bots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/azi.css?v=3">
<style>
  .wrapper, .topbar .in { max-width:860px; }
  .banner { border-radius:8px; overflow:hidden; border:1px solid var(--divider-color); margin-bottom:16px; background:#fff; }
  .banner img { width:100%; display:block; }
  .hubTitle { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:26px 0 14px; padding-bottom:10px; border-bottom:2px solid var(--aziflow-ink); }
  .hubTitle h1 { font-size:26px; font-weight:700; margin:0; }
  .hubTitle p { color:var(--text-secondary); font-size:13px; margin:0; }
  .bots { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .bot { display:flex; align-items:center; gap:12px; padding:16px 18px; border-radius:8px; text-decoration:none; color:var(--text-primary);
         background:var(--page-background); border:1px solid var(--divider-color); transition:transform .15s, border-color .15s, background .15s; }
  a.bot:hover { transform:translateY(-3px); border-color:var(--aziflow-ink); background:var(--surface-light); }
  .bot .icon { font-size:28px; line-height:1; flex-shrink:0; }
  .bot h2 { font-size:17px; font-weight:700; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tags { display:flex; gap:6px; flex-shrink:0; }
  .tag { font-size:11px; font-weight:700; padding:3px 10px; border-radius:6px; background:var(--surface-gray); color:var(--text-dark); }
  .tag.PDF { background:var(--aziflow-ink); color:#fff; }
  .tag.Excel { background:var(--aziflow-yellow); color:var(--aziflow-ink); }
  .bot.soon { opacity:.55; border-style:dashed; cursor:default; }
  .bot.soon .tag.soonTag { background:var(--surface-gray); color:var(--aziflow-red); }
  .footer { text-align:center; color:var(--text-muted); font-size:12px; margin-top:28px; }
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <a class="brand" href="index.html">AZIflow<small>بوتات</small></a>
</div></div>
<div class="wrapper">
  <div class="banner"><img src="shared/brand/header.jpg" alt="AZIflow"></div>

  <div class="hubTitle">
    <h1>🤖 بوتات AZIflow</h1>
    <p>اختر البوت، عبّي البيانات، وطلّع الملف جاهز</p>
  </div>

  <div class="bots" id="bots"></div>

  <div id="credit"></div>
  <div class="footer">AZIflow Bots</div>
</div>

<script src="shared/azi.js"></script>
<script src="bots/registry.js"></script>
<script>
  const grid = document.getElementById("bots");
  const esc = AZI.htmlEsc;
  AZI_BOTS.forEach(b => {
    const el = document.createElement(b.soon ? "div" : "a");
    el.className = "bot" + (b.soon ? " soon" : "");
    if (!b.soon) el.href = "bots/" + encodeURIComponent(b.id) + "/index.html";
    el.innerHTML =
      '<div class="icon">' + esc(b.icon || "🤖") + "</div>" +
      "<h2>" + esc(b.title) + "</h2>" +
      '<div class="tags">' +
        (b.tags || []).map(t => '<span class="tag ' + esc(t) + '">' + esc(t) + "</span>").join("") +
        (b.soon ? '<span class="tag soonTag">قريباً</span>' : "") +
      "</div>";
    grid.appendChild(el);
  });
  AZI.credit.mount(document.getElementById("credit"));
</script>
</body>
</html>
